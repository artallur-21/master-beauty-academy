# =============================================================================
# Master Beauty Academy — Production NGINX Configuration
# Static Astro build served from /var/www/masterbeautyacademy/dist
# =============================================================================

# /etc/nginx/conf.d/masterbeautyacademy.conf

# --- Brotli + Gzip (requires ngx_brotli module) ---
brotli              on;
brotli_comp_level   6;
brotli_static       on;
brotli_types        text/plain text/css application/json application/javascript
                    application/xml+rss application/atom+xml image/svg+xml
                    font/woff2 application/wasm;

gzip                on;
gzip_vary           on;
gzip_min_length     1024;
gzip_comp_level     6;
gzip_proxied        any;
gzip_types          text/plain text/css application/json application/javascript
                    application/xml+rss application/atom+xml image/svg+xml font/woff2;

# --- HTTP/2/3, modern TLS ---
server {
    listen 80;
    listen [::]:80;
    server_name masterbeautyacademy.com www.masterbeautyacademy.com;
    return 301 https://masterbeautyacademy.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # http3 on;  # uncomment if nginx-quic build is available
    server_name www.masterbeautyacademy.com;

    ssl_certificate     /etc/letsencrypt/live/masterbeautyacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masterbeautyacademy.com/privkey.pem;

    return 301 https://masterbeautyacademy.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name masterbeautyacademy.com;

    root  /var/www/masterbeautyacademy/dist;
    index index.html;
    charset utf-8;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/masterbeautyacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masterbeautyacademy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://www.google.com; connect-src 'self';" always;
    add_header X-Robots-Tag              "index, follow, max-image-preview:large, max-snippet:-1";

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Caching by path ---
    # Hashed Astro assets — immutable
    location ^~ /_assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static media
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|mp4|webm)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CSS / JS at root (rare, hashed names preferred)
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML — short cache, must-revalidate
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # XML / sitemap / RSS
    location ~* \.(?:xml|rss)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- Pretty URLs (Astro trailingSlash: 'never') ---
    # Try literal, then .html, then directory index, then 404
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- Strip trailing slash for non-root paths ---
    rewrite ^/(.*)/$ /$1 permanent;

    # --- 404 ---
    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- Deny sensitive files ---
    location ~ /\.(?!well-known) { deny all; }
}
